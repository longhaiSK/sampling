project:
  type: book
  output-dir: .
engine: knitr
author:
  - name: Longhai Li
    url: https://longhaisk.github.io/
date: last-modified
book:
  favicon: favicon.svg
  title: "Elements of Sampling Survey"
  repo-url: "https://github.com/longhaiSK/sampling"
  author: "Longhai Li"
  date: today
  chapters:
    - index.qmd
    - intro.qmd
    - introR.qmd
    - srs.qmd
    - strata.qmd
    - ratio.qmd
    - cluster.qmd
    - ups.qmd
  appendices:
    - formulas.qmd
    - gallery.qmd
    - appendix.qmd

format:
  custombook-html: 
    code-fold: show
  custombook-pdf:
    keep-tex: true
    knitr:
      opts_chunk:
        R.options:
          width: 110
execute: 
  cache: true
  freeze: auto
  warning: false
  message: false
editor: source
filters:
  - shinylive
